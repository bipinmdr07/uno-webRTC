services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uno
      POSTGRES_PASSWORD: uno
      POSTGRES_DB: uno
    ports:
      - '5432:5432'
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  coturn:
    image: coturn/coturn:4
    command: ['-n', '--lt-cred-mech', '--user=uno:uno-turn-secret', '--realm=uno.local', '--listening-port=3478', '--min-port=49160', '--max-port=49200']
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
